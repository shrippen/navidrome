# Build and publish the Sendspin-enabled Navidrome image (drop-in for deluan/navidrome).
name: Docker Sendspin

on:
  push:
    branches: [feat/sendspin-jukebox, master]
    tags: ["v*", "sendspin*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sendspin,enable=${{ github.ref == 'refs/heads/feat/sendspin-jukebox' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=sendspin-latest,enable=${{ github.ref == 'refs/heads/feat/sendspin-jukebox' || github.ref == 'refs/heads/master' }}
            type=sha,prefix=sendspin-
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
